  --navy:#002E52; --orange:#EC6608; --orange-2:#FB6436; --orange-soft:#FDEEE3;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --ink:#002E52; --text:#1E293B; --muted:#64748B;
  --line:#E2E8F0; --mid:#BFBFBF; --ok:#1F8A5B; --ok-soft:#E6F4EC; --warn:#B4530F; --warn-soft:#FDEEE3;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071B2E; --surface:#0C2740; --surface-2:#103150; --ink:#FFFFFF; --text:#E2E8F0; --muted:#A3B1C2;
    --line:#1D4266; --orange-soft:#3A2210; --ok-soft:#123326; --warn-soft:#3A2210;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* Franja institucional de logos: siempre blanca para preservar los logos */
.brand{background:#FFFFFF;border-bottom:1px solid #E2E8F0}
.brand .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 14px}
.brand img{display:block;height:34px;width:auto;max-width:48%;object-fit:contain}
.brand img.gob{height:40px}
@media (max-width:380px){.brand img{height:28px}.brand img.gob{height:33px}}

/* Barra de la aplicación */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;border-bottom:4px solid var(--orange)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:21}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px}
.bar h1{font-size:15px;font-weight:700;margin:0;flex:1;letter-spacing:.6px;cursor:pointer;text-transform:uppercase}
.bar h1 small{display:block;font-weight:500;font-size:11.5px;letter-spacing:0;text-transform:none;color:#C9D6E3}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.pill.on::before,.pill.off::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pill.on::before{background:#4ADE80}.pill.off::before{background:var(--orange-2)}
.badge{border:0;background:var(--orange);color:#fff;font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px;cursor:pointer}
.badge[hidden]{display:none}

main{max-width:760px;margin:0 auto;padding:16px 14px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:14px}
h2{font-size:21px;font-weight:700;margin:4px 0 6px;color:var(--ink)}
.lead{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Título bicolor Transconsult: naranja + azul, mayúsculas, línea naranja */
.tt{font-size:24px;line-height:1.15;font-weight:700;text-transform:uppercase;margin:0 0 18px;color:var(--ink)}
.tt b{display:block;color:var(--orange);font-weight:700}
.tt::after{content:"";display:block;width:70px;height:3px;background:var(--orange-2);margin-top:12px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;min-height:48px;color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:#FFFFFF;border-color:#FFFFFF;color:#002E52}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 160px}

/* Inicio: portada con fondo urbano */
.hero{background:#002E52 var(--fondo) center/cover no-repeat;color:#fff;border-radius:18px;padding:26px 18px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:30px;width:8px;height:62px;background:var(--orange)}
.hero h2{color:#fff;font-size:26px;line-height:1.12;text-transform:uppercase;margin:0 0 6px;padding-left:6px}
.hero h2 b{display:block;color:var(--orange)}
.hero p{margin:0;color:#D5E0EA;padding-left:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.stat{background:rgba(0,46,82,.72);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:700;color:var(--orange-2)}
.stat span{font-size:12px;color:#D5E0EA}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.notice{border-left:4px solid var(--orange);background:var(--orange-soft);padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}

/* Pasos */
.steps{display:flex;gap:4px;margin:4px 0 12px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--navy)}.steps i.cur{background:var(--orange)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps i.done{background:#5D86AD}}
.steplabel{font-size:12.5px;color:var(--muted);font-weight:600}

/* Campos */
.fld{margin:0 0 18px}
.fld[hidden]{display:none}
.fld > label,.fld > .lbl{display:block;font-weight:600;margin-bottom:6px;color:var(--ink)}
.req::after{content:" *";color:var(--orange)}
.help{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.grp{font-size:14px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.4px;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grp:first-child{margin-top:0}
input[type=text],input[type=number],input[type=time],input[type=url],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 12px;min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:none}
textarea{min-height:90px;resize:vertical}
.unit{display:flex;align-items:center;gap:8px}
.unit span{color:var(--muted);font-weight:600;white-space:nowrap}
.dur{display:flex;gap:8px;align-items:center}
.dur input{max-width:110px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:44px;color:var(--ink)}
.chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.sel{background:var(--orange);border-color:var(--orange)}}
.chips.vert{flex-direction:column}
.chips.vert .chip{border-radius:10px;text-align:left}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:480px){.cards{grid-template-columns:1fr}}
.mcard{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px;text-align:left;cursor:pointer;border-left-width:6px}
.mcard b{display:block;font-size:16px;color:var(--ink)}
.mcard span{font-size:13px;color:var(--muted)}
.mcard.sel{border-color:var(--orange);background:var(--orange-soft)}
.err .chips,.err input,.err select,.err .likert{outline:2px solid var(--warn);outline-offset:3px;border-radius:10px}
.err > label,.err > .lbl{color:var(--warn)}
.check{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--orange)}
.info{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:10px;padding:12px;font-size:14px}
.info.warn{border-left-color:var(--orange);background:var(--warn-soft)}
.info.ok{border-left-color:var(--navy)}
.info table{width:100%;border-collapse:collapse}
.info td{padding:3px 0}.info td:last-child{text-align:right;font-weight:600;color:var(--ink)}

/* Escala */
.likert{display:flex;flex-direction:column;gap:2px}
.lk-g{font-weight:700;font-size:13px;color:var(--orange);margin:12px 0 2px}
.lk-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.lk-opts{display:flex;gap:4px}
.lk-opts button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer;color:var(--ink)}
.lk-opts button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lk-opts button.sel{background:var(--orange);border-color:var(--orange)}}
.lk-row.miss .lk-lbl{color:var(--warn)}
@media (max-width:520px){.lk-row{grid-template-columns:1fr}.lk-opts button{flex:1}}
.scale{font-size:12px;color:var(--muted);margin-bottom:6px}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.nav .btn{flex:1}

/* Ficha de elección */
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:12px}
.ficha h2{font-size:20px;margin:0 0 10px}
.ficha h2::after{content:"";display:block;width:70px;height:3px;background:var(--orange-2);margin-top:10px}
.ficha .sup{font-size:13.5px;color:var(--muted);margin:0 0 6px}
.fmeta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.fmeta .tag{background:var(--navy);color:#fff}
.tbl{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0 4px}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .alt{width:25%;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.tbl thead th.alt{background:var(--navy);border-radius:12px 12px 0 0;border-bottom:4px solid var(--orange)}
.tbl thead th.alt b{display:block;font-size:30px;line-height:1.05;color:#fff}
.tbl thead th.alt span{font-size:12px;font-weight:500;color:#C9D6E3}
.tbl td.lab{font-size:14.5px}
.tbl tr.sub td{font-size:12px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.4px;border-bottom:0;padding-top:14px}
.tbl tr.tot td{font-weight:700;background:var(--surface-2);color:var(--ink)}
.tbl tr.tot td.alt{font-size:22px}
.tbl td.alt.selcol{background:var(--orange-soft)}
.tbl thead th.alt.selcol{background:var(--orange);border-bottom-color:var(--orange)}
.tbl thead th.alt.selcol span{color:#fff}
.tbl .u{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.q{font-size:17px;font-weight:700;text-align:center;margin:16px 0 10px;color:var(--ink)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choose .btn{min-height:68px;font-size:24px;border-width:2px;border-color:var(--navy)}
.choose .btn.sel{background:var(--orange);border-color:var(--orange);color:#fff}
.note{font-size:12.5px;color:var(--muted);margin-top:12px}
.flist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.flist div{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;background:var(--surface-2)}
.flist div b{display:block;font-size:18px;color:var(--ink)}
.flist div.ok{background:var(--ok-soft);border-color:var(--ok)}
.flist div.om{background:var(--warn-soft);border-color:var(--warn)}

/* Listado */
.list{width:100%;border-collapse:collapse;font-size:14px}
.list th{color:var(--orange);font-weight:700;font-size:12.5px;text-transform:uppercase}
.list th,.list td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.p{background:var(--orange-soft);color:var(--warn)}.tag.s{background:var(--ok-soft);color:var(--ok)}
.scroll{overflow-x:auto}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;border-left:4px solid var(--orange);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

</head>

const MODS = {

  AUTO:{nombre:"Automóvil", corto:"Automóvil", desc:"Conductor de auto frente a bus directo"},
  MOTO:{nombre:"Motocicleta", corto:"Moto", desc:"Conductor de moto frente a bus directo"},
  TAXI:{nombre:"Taxi / App", corto:"Taxi / App", desc:"Usuario de taxi o app frente a bus directo"}
};
const isPriv = d => d.modulo && d.modulo !== "TPC";
const COLS = ["ficha","perfil","bloque","tarea","peaje_aplica","distancia_km","rendimiento_km_galon","precio_cop_galon","participacion_conductor","auto_conduccion_min","auto_busca_min","auto_caminata_min","auto_total_min","gasolina_cop","peaje_cop","parqueo_cop","auto_total_cop","tp_bordo_min","tp_caminata_min","tp_espera_min","tp_total_min","tp_tarifa_cop"];
const bankRow = arr => { const o = {}; COLS.forEach((c,i)=>o[c]=arr[i]); return o; };

function perfilDe(min){ min = num(min); if(min == null) return null; return min < 15 ? "Corto" : (min <= 30 ? "Medio" : "Largo"); }
function tiempoPerfil(d){ return d.modulo === "TPC" ? d.tiempo_vehiculo_min : d.tiempo_viaje_min; }
function kmGal(d){ const r = num(d.rendimiento); if(!r) return null; return d.rend_unidad === "km/L" ? r*3.78541 : r; }
function filtro(d){
  if(!isPriv(d)) return "Aplica";
  const m = [];
  if(d.modulo !== "TAXI" && d.es_conductor === "N") m.push("no es conductor");
  if(d.puede_elegir === "N") m.push("no puede elegir el modo");
  if(d.tp_directo === "N") m.push("no existe bus directo factible");
  return m.length ? "No aplica: " + m.join(", ") : "Aplica";
}
function costosRef(d){
  const km = num(d.distancia_km), kg = kmGal(d), pr = num(d.precio_galon), fg = (num(d.frac_gasolina) ?? 100)/100;
  const gas = (km && kg && pr) ? km/kg*pr*fg : null;
  const peaje = d.paga_peaje === "S" ? (num(d.valor_peaje)||0)*((num(d.frac_peaje) ?? 100)/100) : 0;
  const parq = d.paga_parqueo === "S" ? (num(d.costo_parqueo)||0)*((num(d.frac_parqueo) ?? 100)/100) : 0;
  const total = gas == null ? null : gas + peaje + parq;
  const gp = d.gasto_no_sabe ? null : num(d.gasto_percibido);
  return {gas, peaje, parq, total, brecha: (total != null && gp != null) ? total - gp : null};
}

/* Balance de bloques por municipio y perfil (en este dispositivo) */
function bloqueBalanceado(mod, mun, perfil){
  const bal = LS.get(K.bal, {}); const c = bal[mod+"|"+mun+"|"+perfil] || {1:0,2:0};
  if(c[1] < c[2]) return 1; if(c[2] < c[1]) return 2; return Math.random() < .5 ? 1 : 2;
}
function registrarBalance(rec){
  if(!rec.diseno || !rec.diseno.bloque || !rec.elecciones || !rec.elecciones.length) return;
  const bal = LS.get(K.bal, {}); const key = rec.datos.modulo+"|"+rec.datos.municipio_encuesta+"|"+rec.diseno.perfil;
  bal[key] = bal[key] || {1:0,2:0}; bal[key][rec.diseno.bloque]++; LS.set(K.bal, bal);
}
function sugerirBloque(rec){
  const d = rec.datos, perfil = perfilDe(tiempoPerfil(d));
  if(!perfil) return {perfil:null, bloque:null, regla:""};
  return {perfil, bloque:bloqueBalanceado(d.modulo, d.municipio_encuesta, perfil), regla:"Aleatorio balanceado por municipio y perfil"};
}
/* Generación de las seis fichas */
function generarFichas(rec){
  const d = rec.datos, mod = d.modulo, {perfil, bloque} = rec.diseno;
  const tareas = shuffle([1,2,3,4,5,6]);
  if(mod === "TPC"){
    rec.elecciones = tareas.map((t,i)=>{
      const id = perfil[0] + bloque + "-0" + t, f = BANK.TPC[id];
      return {orden:i+1, tarea:t, ficha:id, catalogo:(perfil==="Corto"?0:perfil==="Medio"?12:24)+(bloque-1)*6+t,
              A:f.A, B:f.B, respuesta:"", segundos:null, motivo_omision:"", usaria:"", usaria_porque:""};
    });
    return;
  }
  const rows = BANK[mod].map(bankRow);
  const media = (()=>{ const r = rows.filter(x=>x.perfil===perfil); return r.reduce((s,x)=>s+x.rendimiento_km_galon,0)/r.length; })();
  const kg = kmGal(d), km = num(d.distancia_km), pr = num(d.precio_galon) || CFG.precio;
  const fg = (num(d.frac_gasolina) ?? 100)/100;
  const adapt = mod !== "TAXI" && d.tecnologia !== "Eléctrico" && km > 0 && kg > 0;
  const fp = (mod !== "TAXI" && d.paga_peaje === "S") ? (num(d.frac_peaje) ?? 100)/100 : 1;
  const fq = (mod === "TAXI") ? 1 : (d.paga_parqueo === "S" ? (num(d.frac_parqueo) ?? 100)/100 : 1);
  const lado0 = Math.random() < .5 ? "A" : "B";
  rec.diseno.gasolina_adaptada = adapt ? 1 : 0;
  rec.elecciones = tareas.map((t,i)=>{
    const idx = rows.findIndex(x=>x.perfil===perfil && x.bloque===bloque && x.tarea===t), b = rows[idx];
    const rendAdapt = adapt ? kg*(b.rendimiento_km_galon/media) : b.rendimiento_km_galon;
    const gas = adapt ? r100(km/rendAdapt*pr*fg) : b.gasolina_cop;
    const peaje = r100(b.peaje_cop*fp), parq = r100(b.parqueo_cop*fq);
    return Object.assign({}, b, {
      orden:i+1, catalogo:idx+1,
      distancia_km: adapt ? km : b.distancia_km,
      rendimiento_km_galon: Math.round(rendAdapt*100)/100,
      precio_cop_galon: adapt ? pr : b.precio_cop_galon,
      participacion_conductor: adapt ? fg : b.participacion_conductor,
      gasolina_cop:gas, peaje_cop:peaje, parqueo_cop:parq, auto_total_cop:gas+peaje+parq,
      lado_tp: i%2===0 ? (lado0==="A"?"A":"B") : (lado0==="A"?"B":"A"),
      respuesta:"", eligio_tp:null, segundos:null, motivo_omision:"",
      fraccion_peaje:fp, fraccion_parqueo:fq
    });
  });
}

  if(c.gas == null) return "Complete distancia, rendimiento y precio para ver el costo reconstruido de la ida.";
  return "<table><tr><td>Gasolina personal</td><td>"+money(c.gas)+"</td></tr><tr><td>Peaje personal</td><td>"+money(c.peaje)+"</td></tr>"+
    "<tr><td>Parqueo personal de la visita</td><td>"+money(c.parq)+"</td></tr><tr><td><b>Total reconstruido</b></td><td>"+money(c.total)+"</td></tr>"+
    (c.brecha != null ? "<tr><td>Brecha frente al gasto percibido</td><td>"+(c.brecha>=0?"+":"−")+money(Math.abs(c.brecha))+"</td></tr>" : "")+"</table>";
}

/* ---------- Renderizado de campos ---------- */
const norm = o => o.map(x => Array.isArray(x) ? {v:x[0], l:x[1], s:x[2]} : {v:x, l:String(x)});
const isReq = (f,d) => typeof f.req === "function" ? f.req(d) : !!f.req;
const visible = (f,d) => !f.show || f.show(d);

function fieldHTML(f, d, i){
  const lab = f.label ? `<${f.t==="chips"||f.t==="multi"||f.t==="cards"||f.t==="likert"||f.t==="dur"?"div class=\"lbl":"label for=\"f_"+f.k}${isReq(f,d)?" req":""}">${esc(f.label)}</${f.t==="chips"||f.t==="multi"||f.t==="cards"||f.t==="likert"||f.t==="dur"?"div":"label"}>` : "";
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : "";
  const v = d[f.k];
  let body = "";
  switch(f.t){
    case "h": return `<h3 class="grp fld" data-i="${i}">${esc(f.label)}</h3>`;
    case "text": body = `<input type="text" id="f_${f.k}" data-k="${f.k}" value="${esc(v)}" autocomplete="off">`; break;
    case "area": body = `<textarea id="f_${f.k}" data-k="${f.k}">${esc(v)}</textarea>`; break;
    case "time": body = `<input type="time" id="f_${f.k}" data-k="${f.k}" value="${esc(v)}">`; break;
    case "num": {
      let suf = f.unit ? `<span>${esc(f.unit)}</span>` : "";
      if(f.unitSel) suf = `<select data-k="${f.unitSel.k}" style="max-width:120px">${f.unitSel.opts.map(o=>`<option${d[f.unitSel.k]===o?" selected":""}>${o}</option>`).join("")}</select>`;
      body = `<div class="unit"><input type="number" inputmode="decimal" step="any" min="0" id="f_${f.k}" data-k="${f.k}" value="${esc(v)}">${suf}</div>`;
      if(f.check) body += `<label class="check"><input type="checkbox" data-chk="${f.check.k}"${d[f.check.k]?" checked":""}> ${esc(f.check.label)}</label>`;
      break;
    }
    case "dur": {
      const h = v != null && v !== "" ? Math.floor(v/60) : "", m = v != null && v !== "" ? v%60 : "";
      body = `<div class="dur"><input type="number" inputmode="numeric" min="0" data-dur="${f.k}" data-part="h" value="${h}" aria-label="Horas"><span class="muted">h</span>
              <input type="number" inputmode="numeric" min="0" max="59" data-dur="${f.k}" data-part="m" value="${m}" aria-label="Minutos"><span class="muted">min</span></div>`;
      break;
    }
    case "select": body = `<select id="f_${f.k}" data-k="${f.k}"><option value="">Seleccione…</option>${norm(f.opts).map(o=>`<option value="${esc(o.v)}"${String(v)===String(o.v)?" selected":""}>${o.v}. ${esc(o.l)}</option>`).join("")}</select>`; break;
    case "chips": body = `<div class="chips${f.vert?" vert":""}">${norm(f.opts).map(o=>`<button type="button" class="chip${String(v)===String(o.v)?" sel":""}" data-ck="${f.k}" data-v="${esc(o.v)}">${f.vert?o.v+". ":""}${esc(o.l)}</button>`).join("")}</div>`; break;
    case "multi": {
      const arr = Array.isArray(v) ? v : [];
      body = `<div class="chips vert">${norm(f.opts).map(o=>`<button type="button" class="chip${arr.map(String).includes(String(o.v))?" sel":""}" data-mk="${f.k}" data-max="${f.max||99}" data-v="${esc(o.v)}">${o.v}. ${esc(o.l)}</button>`).join("")}</div>`;
      break;
    }
    case "cards": body = `<div class="cards">${norm(f.opts).map(o=>`<button type="button" class="mcard${v===o.v?" sel":""}" data-ck="${f.k}" data-v="${esc(o.v)}"><b>${esc(o.l)}</b><span>${esc(o.s||"")}</span></button>`).join("")}</div>`; break;
    case "likert": {
      body = `<div class="scale">1 Nada importante · 2 Poco importante · 3 Neutral · 4 Importante · 5 Muy importante</div><div class="likert">` +
        f.items.map(it => it.g ? `<div class="lk-g">${esc(it.g)}</div>` :
          `<div class="lk-row" data-row="${it[0]}"><div class="lk-lbl">${esc(it[1])}</div><div class="lk-opts">${[1,2,3,4,5].map(n=>`<button type="button" data-lk="${it[0]}" data-v="${n}" class="${d[it[0]]==n?"sel":""}" aria-label="${esc(it[1])}: ${n}">${n}</button>`).join("")}</div></div>`).join("") + `</div>`;
      break;
    }
    case "info": return `<div class="fld" data-i="${i}"><div class="info ${f.cls||""}" data-info="${i}">${f.html(d)}</div></div>`;
    case "gps": {
      const g = S.rec.gps;
      body = `<div class="row" style="align-items:center"><button type="button" class="btn" data-gps="1" style="flex:0 0 auto">Capturar ubicación</button>
              <span class="small muted" id="gpsTxt">${g ? `${g.lat.toFixed(5)}, ${g.lon.toFixed(5)} (±${Math.round(g.acc)} m)` : "Sin ubicación (opcional)"}</span></div>`;
      break;
    }
  }
  return `<div class="fld" data-i="${i}" data-fk="${f.k||""}">${lab}${help}${body}</div>`;
}

function refreshVisibility(){
  const d = S.rec.datos;
  S.fields.forEach((f,i)=>{
    const el = app.querySelector(`[data-i="${i}"]`); if(!el) return;
    el.hidden = !visible(f,d);
    if(f.t === "info"){ const box = el.querySelector("[data-info]"); if(box) box.innerHTML = f.html(d); }
    const lb = el.querySelector(".lbl,label[for]"); if(lb && f.req) lb.classList.toggle("req", isReq(f,d));
  });
}
function missingFields(){
  const d = S.rec.datos, miss = [];
  S.fields.forEach((f,i)=>{
    if(!f.k || f.t==="info" || f.t==="h" || !visible(f,d) || !isReq(f,d)) return;
    let bad;
    if(f.t === "likert") bad = f.items.some(it => !it.g && !d[it[0]]);
    else if(f.t === "multi") bad = !Array.isArray(d[f.k]) || !d[f.k].length;
    else bad = d[f.k] === undefined || d[f.k] === null || d[f.k] === "";
    if(bad) miss.push(i);
  });
  return miss;
}

function vElecIntro(){
  const rec = S.rec, d = rec.datos;
  const fl = filtro(d);
  if(fl !== "Aplica"){
    rec.elecciones = []; rec.diseno = {perfil:perfilDe(tiempoPerfil(d)), bloque:null, regla:"", filtro:fl};
    return `<div class="info warn">${esc(fl)}. El bloque de fichas no se aplica a este participante; continúe con el cierre.</div>`;
  }
  const sug = sugerirBloque(rec);
  if(!sug.perfil) return `<div class="info warn">Falta el tiempo del viaje en el paso «Viaje habitual». Regrese y complételo para asignar el perfil.</div>`;
  const answered = (rec.elecciones||[]).filter(e=>e.respuesta||e.motivo_omision).length;
  if(!rec.diseno || !rec.diseno.bloque || rec.diseno.perfil !== sug.perfil || rec.diseno.modulo !== d.modulo){
    if(!answered){ rec.diseno = Object.assign({}, sug, {filtro:"Aplica", modulo:d.modulo}); rec.elecciones = null; saveDraft(); }
  }
  const ds = rec.diseno, started = rec.elecciones && rec.elecciones.length;
  const lista = started ? `<div class="flist">${rec.elecciones.map(e=>{ const st = e.respuesta ? "ok" : e.motivo_omision ? "om" : ""; return `<div class="${st}">Ficha ${e.orden}<b>${e.respuesta || (e.motivo_omision?"—":"·")}</b></div>`; }).join("")}</div>` : "";
  const mismatch = started && ds.perfil !== sug.perfil;
  return `<p class="lead">La ficha se define por el modo y la duración del viaje; se aplica uno de sus dos bloques al azar, con seis tareas en orden aleatorio${d.modulo!=="TPC"?" y con alternancia del lado en que aparece el bus":""}.</p>
    <div class="info ok"><table>
      <tr><td>Módulo</td><td>${esc(MODS[d.modulo].nombre)}</td></tr>
      <tr><td>Perfil de duración</td><td>${ds.perfil} (${tiempoPerfil(d)} min)</td></tr>
      <tr><td>Regla del bloque</td><td>${esc(ds.regla)}</td></tr>
      ${ds.gasolina_adaptada!=null && d.modulo!=="TPC" && d.modulo!=="TAXI" ? `<tr><td>Gasolina de las fichas</td><td>${ds.gasolina_adaptada?"Adaptada al viaje":"Valores del banco"}</td></tr>`:""}
    </table></div>
    ${mismatch ? `<div class="info warn" style="margin-top:10px">El tiempo del viaje cambió después de iniciar las fichas (perfil actual: ${sug.perfil}). Use «Rehacer bloque» si debe corregirse.</div>`:""}
    <div class="fld" style="margin-top:16px"><div class="lbl">Bloque asignado</div>
      <div class="chips">${[1,2].map(b=>`<button type="button" class="chip${ds.bloque===b?" sel":""}" data-bloque="${b}"${started?" disabled":""}>Bloque ${b}</button>`).join("")}</div>
      <div class="help" style="margin-top:6px">Se sugiere automáticamente; modifíquelo solo si el protocolo de campo lo exige.</div></div>
    ${lista}
    <div class="row">
      ${!started ? `<button class="btn accent" data-act="startF">Iniciar las seis fichas</button>`
                 : `<button class="btn accent" data-act="contF">${answered<6?"Continuar fichas":"Revisar fichas"}</button><button class="btn danger" data-act="redoF">Rehacer bloque</button>`}
    </div>`;
}

function fichaRows(e, mod){
  if(mod === "TPC"){
    const A = e.A, B = e.B, tot = x => x[0]+x[3]+x[4];
    return {heads:[["A","Ruta A"],["B","Ruta B"]], rows:[
      ["sub","Para este viaje de ida"],
      ["Minutos dentro del bus o de los buses", A[0], B[0], "min"],
      ["Pago total por todo el viaje", A[1], B[1], "cop"],
      ["Veces que debe bajarse y cambiar de bus", A[2], B[2], ""],
      ["Minutos caminando para cambiar de bus", A[3], B[3], "min"],
      ["Minutos esperando el siguiente bus al cambiar", A[4], B[4], "min"],
      ["tot","Del primer abordaje a la última bajada", tot(A), tot(B), "min"]
    ]};
  }
  const pv = mod==="AUTO" ? "Automóvil" : mod==="MOTO" ? "Moto" : "Taxi / App";
  const P = [], T = [];
  const add = (lab, a, b, u, tot) => { P.push([lab,a,b,u,tot]); };
  const rows = [["sub","Tiempos"]];
  rows.push(["Minutos dentro del vehículo", e.auto_conduccion_min, e.tp_bordo_min, "min"]);
  rows.push([mod==="TAXI" ? "Minutos esperando el taxi o vehículo de app" : "Minutos buscando estacionamiento", e.auto_busca_min, 0, "min"]);
  rows.push(["Minutos caminando durante la ida", e.auto_caminata_min, e.tp_caminata_min, "min"]);
  rows.push(["Minutos esperando el bus", 0, e.tp_espera_min, "min"]);
  rows.push(["tot","Tiempo total de puerta a puerta", e.auto_total_min, e.tp_total_min, "min"]);
  rows.push(["sub","Pagos"]);
  if(mod === "TAXI") rows.push(["Tarifa del taxi o app", e.gasolina_cop, 0, "cop"]);
  else rows.push(["Gasolina que usted pagaría por esta ida", e.gasolina_cop, 0, "cop"]);
  if(mod === "AUTO" || e.peaje_cop) rows.push(["Peajes que usted pagaría en este sentido", e.peaje_cop, 0, "cop"]);
  if(mod !== "TAXI") rows.push(["Parqueo que usted pagaría", e.parqueo_cop, 0, "cop"]);
  rows.push(["Pasaje que usted pagaría por la ida", 0, e.tp_tarifa_cop, "cop"]);
  rows.push(["tot","Total que sale de su bolsillo", e.auto_total_cop, e.tp_tarifa_cop, "cop"]);
  // reordenar columnas según el lado del bus
  const tpA = e.lado_tp === "A";
  return {heads: tpA ? [["A","Bus directo"],["B",pv]] : [["A",pv],["B","Bus directo"]],
    rows: rows.map(r => {
      if(r[0]==="sub") return r;
      if(r[0]==="tot") return tpA ? ["tot",r[1],r[3],r[2],r[4]] : r;
      return tpA ? [r[0],r[2],r[1],r[3]] : r;
    })};
}
const fmt = (v,u,tot) => u==="cop" ? money(v) : `${v}${u==="min"&&tot?'<span class="u">min</span>':""}`;

function vFicha(){
  const rec = S.rec, mod = rec.datos.modulo, e = rec.elecciones[S.ficha];
  if(!e.respuesta && !e.motivo_omision && !e._t0) e._t0 = Date.now();
  const {heads, rows} = fichaRows(e, mod);
  const sel = e.respuesta;
  const selCls = L => sel===L ? " selcol" : "";
  const body = rows.map(r => {
    if(r[0]==="sub") return `<tr class="sub"><td colspan="3">${esc(r[1])}</td></tr>`;
    if(r[0]==="tot") return `<tr class="tot"><td class="lab">${esc(r[1])}</td><td class="alt${selCls("A")}">${fmt(r[2],r[4],1)}</td><td class="alt${selCls("B")}">${fmt(r[3],r[4],1)}</td></tr>`;
    return `<tr><td class="lab">${esc(r[0])}</td><td class="alt${selCls("A")}">${fmt(r[1],r[3])}</td><td class="alt${selCls("B")}">${fmt(r[2],r[3])}</td></tr>`;
  }).join("");
  const intro = mod==="TPC"
    ? `<h2>¿Qué ruta elegiría para su viaje?</h2><p class="sup">Piense en el viaje de ida que acaba de describir. Ambas rutas le llevan al mismo destino. Suponga que la caminata de acceso y salida, la espera inicial, la comodidad, la seguridad y la puntualidad son iguales en ambas rutas.</p>`
    : `<h2>¿Cómo haría este viaje de ida?</h2><p class="sup">Imagine la misma ida, desde el mismo origen hasta el mismo destino, con el mismo motivo, la misma hora de salida y la misma permanencia en destino. Suponga igual seguridad, comodidad y puntualidad en ambas alternativas, bajo el mismo clima. El bus es directo y tiene cupo. Considere solo los tiempos y pagos indicados.</p>`;
  const nota = mod==="TPC"
    ? "Un cambio significa bajarse de un bus y subirse a otro para continuar. El pago cubre todos los pasajes. El total de minutos excluye la caminata de acceso y salida y la espera antes del primer bus."
    : "Cero significa que ese rubro no genera pago o tiempo en esa alternativa." + (mod!=="TAXI" ? " El parqueo corresponde a la visita y se carga una sola vez." : "");
  const done = !!(e.respuesta || e.motivo_omision), lastF = S.ficha === rec.elecciones.length-1;
  return `<div class="ficha">
    <div class="fmeta"><span>Ficha ${S.ficha+1} de ${rec.elecciones.length}</span><span class="tag">${esc(e.ficha)}</span></div>
    ${intro}
    <table class="tbl"><thead><tr><th></th>${heads.map(h=>`<th class="alt${selCls(h[0])}"><b>${h[0]}</b><span>${esc(h[1])}</span></th>`).join("")}</tr></thead><tbody>${body}</tbody></table>
    <p class="q">Si estas fueran sus dos opciones, ¿cuál elegiría: A o B?</p>
    <div class="choose">
      <button class="btn${sel==="A"?" sel":""}" data-pick="A">A</button>
      <button class="btn${sel==="B"?" sel":""}" data-pick="B">B</button>
    </div>
    <div style="margin-top:10px">
      ${e.motivo_omision || S._omit ? `<div class="lbl" style="font-weight:700;margin:8px 0 6px">Motivo de la omisión</div><div class="chips">${OP.omision.map(o=>`<button type="button" class="chip${e.motivo_omision===o?" sel":""}" data-omit="${esc(o)}">${esc(o)}</button>`).join("")}</div>`
        : `<button class="btn ghost block" data-act="omit">No responde</button>`}
    </div>
    ${mod==="TPC" && e.respuesta ? `<div style="margin-top:14px"><div class="lbl" style="font-weight:700;margin-bottom:6px">¿Realmente usaría la ruta escogida?</div>
      <div class="chips">${OP.sn.map(o=>`<button type="button" class="chip${e.usaria===o[0]?" sel":""}" data-usaria="${o[0]}">${o[1]}</button>`).join("")}</div>
      <input type="text" data-porque="1" placeholder="¿Por qué? (opcional)" value="${esc(e.usaria_porque)}" style="margin-top:8px"></div>` : ""}
    <p class="note">${nota}</p>
  </div>
  <nav class="nav"><div class="in">
    <button class="btn" data-act="fPrev">${S.ficha===0?"Volver al bloque":"Ficha anterior"}</button>
    <button class="btn ${lastF?"accent":"primary"}" data-act="fNext"${done?"":" disabled"}>${lastF?"Terminar fichas":"Siguiente ficha"}</button>
  </div></nav>`;
}

  return `<h2>Encuestas en el dispositivo</h2>
  <div class="card scroll">${q.length ? `<table class="list"><thead><tr><th>Fecha</th><th>Módulo</th><th>Municipio</th><th>Fichas</th><th>Estado</th></tr></thead><tbody>
    ${q.map(r=>`<tr><td>${new Date(r.fin||r.inicio).toLocaleString("es-CO",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(MODS[r.datos.modulo]?.corto||"")}</td><td>${esc(r.datos.municipio_encuesta||"")}</td>
      <td>${(r.elecciones||[]).filter(e=>e.respuesta).length}/${(r.elecciones||[]).length}</td>
      <td><span class="tag ${r.estado==="enviada"?"s":"p"}">${r.estado==="enviada"?"Enviada":"Pendiente"}</span></td></tr>`).join("")}</tbody></table>` : `<p class="muted">Aún no hay encuestas guardadas.</p>`}</div>
  <div class="row"><button class="btn" data-act="home">Volver</button><button class="btn danger" data-act="purge"${!q.some(r=>r.estado==="enviada")?" disabled":""}>Eliminar las ya enviadas</button></div>`;
}

function vCfg(){
  let used = 0; try{ for(const k in localStorage){ if(k.startsWith("pd_")) used += (localStorage.getItem(k)||"").length; } }catch(e){}
  return `<h2>Ajustes</h2>
  <div class="card">
    <div class="fld"><label for="c_enc" class="req">Encuestador</label><input type="text" id="c_enc" value="${esc(CFG.encuestador)}" placeholder="Nombre o código"></div>
    <div class="fld"><label for="c_url">URL del servidor (Apps Script /exec)</label><input type="url" id="c_url" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec">
      <div class="help" style="margin-top:6px">Se obtiene al implementar el script como aplicación web.</div></div>
    <div class="fld"><label for="c_pr">Precio de referencia de la gasolina</label><div class="unit"><input type="number" id="c_pr" value="${esc(CFG.precio)}"><span>COP/galón</span></div></div>
    <div class="fld"><div class="lbl">Identificador del dispositivo</div><div>${esc(CFG.device)}</div></div>
    <p class="small muted">Espacio usado por la aplicación: ${(used/1024).toFixed(0)} KB.</p>
    <div class="row"><button class="btn primary" data-act="saveCfg">Guardar ajustes</button><button class="btn" data-act="testUrl">Probar conexión</button><button class="btn ghost" data-act="home">Volver</button></div>
  </div>`;
}

function render(){
  document.getElementById("pend").hidden = true;
  updateNet();
  switch(S.view){
    case "home": app.innerHTML = vHome(); break;
    case "form": app.innerHTML = vForm(); refreshVisibility(); break;
    case "ficha": app.innerHTML = vFicha(); break;
    case "done": app.innerHTML = vDone(); break;
    case "list": app.innerHTML = vList(); break;
    case "cfg": app.innerHTML = vCfg(); break;
  }
}

/* ---------- Nueva encuesta ---------- */
function newSurvey(){
  if(!CFG.encuestador){ toast("Registre primero el encuestador en Ajustes"); go("cfg"); return; }
  S.rec = {id:uuid(), version:APP_VERSION, dispositivo:CFG.device, inicio:nowISO(), actualizado:nowISO(), gps:null,
    datos:{encuestador:CFG.encuestador, frac_gasolina:100, frac_peaje:100, frac_parqueo:100, precio_galon:CFG.precio, rend_unidad:"km/gal"},
    diseno:null, elecciones:null, estado:"borrador"};
  S.step = 0; saveDraft(); go("form"); captureGPS(true);
}
function captureGPS(silent){
  if(!navigator.geolocation){ if(!silent) toast("Este dispositivo no permite ubicación"); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    if(!S.rec) return;
    S.rec.gps = {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy, t:nowISO()}; saveDraft();
    const el = document.getElementById("gpsTxt"); if(el) el.textContent = `${S.rec.gps.lat.toFixed(5)}, ${S.rec.gps.lon.toFixed(5)} (±${Math.round(S.rec.gps.acc)} m)`;
  }, ()=>{ if(!silent) toast("No fue posible obtener la ubicación"); }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}

/* ---------- Construcción de filas para la base ---------- */
function filaEncuesta(r){
  const d = r.datos, c = isPriv(d) && d.modulo!=="TAXI" ? costosRef(d) : {};
  const el = r.elecciones || [];
  const o = {
    id:r.id, modulo:d.modulo, encuestador:d.encuestador, dispositivo:r.dispositivo, version_app:r.version,
    inicio:r.inicio, fin:r.fin, duracion_min: r.fin ? Math.round((new Date(r.fin)-new Date(r.inicio))/60000) : "",
    lat:r.gps?r.gps.lat:"", lon:r.gps?r.gps.lon:"", precision_m:r.gps?Math.round(r.gps.acc):"",
    perfil:r.diseno?r.diseno.perfil:"", bloque:r.diseno?r.diseno.bloque:"", regla_bloque:r.diseno?r.diseno.regla:"", filtro:r.diseno?r.diseno.filtro:filtro(d),
    gasolina_adaptada:r.diseno&&r.diseno.gasolina_adaptada!=null?r.diseno.gasolina_adaptada:"",
    fichas_respondidas: el.filter(e=>e.respuesta).length, fichas_omitidas: el.filter(e=>!e.respuesta&&e.motivo_omision).length,
    n_eligio_tp: isPriv(d) ? el.filter(e=>e.eligio_tp===1).length : "",
    costo_reconstruido_cop: c.total!=null?Math.round(c.total):"", brecha_percepcion_cop: c.brecha!=null?Math.round(c.brecha):""
  };
  Object.keys(d).forEach(k=>{ if(k.startsWith("_") || k==="modulo" || k==="encuestador") return; const v = d[k]; o[k] = Array.isArray(v) ? v.join("|") : (typeof v==="boolean" ? (v?1:0) : v); });
  return o;
}
function filasElecciones(r){
  const d = r.datos, el = r.elecciones || [];
  if(!el.length) return {priv:[], tpc:[]};
  if(d.modulo === "TPC"){
    const out = [];
    el.forEach(e=>["A","B"].forEach(L=>{
      const x = e[L];
      out.push({id:r.id, tarea:e.ficha, alternativa:L, elegida: e.respuesta ? (e.respuesta===L?1:0) : "",
        a_bordo_min:x[0], tarifa_cop:x[1], transbordos:x[2], caminata_enlace_min:x[3], espera_enlace_min:x[4],
        municipio:d.municipio_encuesta, perfil:r.diseno.perfil, bloque:r.diseno.bloque,
        orden:e.orden, catalogo:e.catalogo, segundos:e.segundos ?? "", motivo_omision:e.motivo_omision, usaria:e.usaria, usaria_porque:e.usaria_porque,
        encuestador:d.encuestador, fecha:r.fin});
    }));
    return {priv:[], tpc:out};
  }
  return {tpc:[], priv: el.map(e=>({
    id:r.id, modulo:d.modulo, orden:e.orden, ficha:e.ficha, catalogo:e.catalogo, perfil:e.perfil, bloque:e.bloque, tarea:e.tarea, peaje_aplica:e.peaje_aplica,
    distancia_km:e.distancia_km, rendimiento_km_galon:e.rendimiento_km_galon, precio_cop_galon:e.precio_cop_galon, participacion_conductor:e.participacion_conductor,
    auto_conduccion_min:e.auto_conduccion_min, auto_busca_min:e.auto_busca_min, auto_caminata_min:e.auto_caminata_min, auto_total_min:e.auto_total_min,
    gasolina_cop:e.gasolina_cop, peaje_cop:e.peaje_cop, parqueo_cop:e.parqueo_cop, auto_total_cop:e.auto_total_cop,
    tp_bordo_min:e.tp_bordo_min, tp_caminata_min:e.tp_caminata_min, tp_espera_min:e.tp_espera_min, tp_total_min:e.tp_total_min, tp_tarifa_cop:e.tp_tarifa_cop,
    lado_tp:e.lado_tp, respuesta_mostrada:e.respuesta, eligio_tp: e.eligio_tp==null?"":e.eligio_tp, segundos:e.segundos ?? "", motivo_omision:e.motivo_omision,
    origen:"Campo", municipio:d.municipio_encuesta, fraccion_peaje:e.fraccion_peaje, fraccion_parqueo:e.fraccion_parqueo,
    encuestador:d.encuestador, fecha:r.fin
  }))};
}

function finishSurvey(){
  const miss = missingFields(); if(miss.length){ markMissing(miss); return; }
  const r = S.rec; r.fin = nowISO(); r.estado = "pendiente"; delete r._step;
  (r.elecciones||[]).forEach(e=>delete e._t0);
  const q = queue(); q.push(r);
  if(!saveQueue(q)) return;
  registrarBalance(r);
  LS.del(K.draft); S.rec = null; S._lastSync = "Quedó almacenada en el dispositivo.";
  go("done");
  sync(true).then(n=>{ if(n>0 && S.view==="done"){ S._lastSync = "Quedó almacenada en el dispositivo y fue enviada al servidor."; render(); } });
}
function markMissing(miss){
  app.querySelectorAll(".err").forEach(x=>x.classList.remove("err"));
  const d = S.rec.datos;
  miss.forEach(i=>{
    const el = app.querySelector(`[data-i="${i}"]`); if(!el) return; el.classList.add("err");
    if(S.fields[i].t==="likert") S.fields[i].items.forEach(it=>{ if(!it.g){ const row = el.querySelector(`[data-row="${it[0]}"]`); if(row) row.classList.toggle("miss", !d[it[0]]); } });
  });
  const first = app.querySelector(`[data-i="${miss[0]}"]`); if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
  toast(`Faltan ${miss.length} respuesta${miss.length>1?"s":""} obligatoria${miss.length>1?"s":""}`);
}

/* ---------- Sincronización con Apps Script ---------- */
let syncing = false;
async function sync(silent){
  if(syncing) return 0;
  if(!CFG.url){ if(!silent) toast("Configure la URL del servidor en Ajustes"); return 0; }
  if(!navigator.onLine){ if(!silent) toast("Sin conexión: las encuestas siguen guardadas en el dispositivo"); return 0; }
  const pend = queue().filter(r=>r.estado!=="enviada"); if(!pend.length) return 0;
  syncing = true; let sent = 0;
  try{
    for(let i=0; i<pend.length; i+=10){
      const lote = pend.slice(i, i+10);
      const payload = {app:"encuestas-pd", version:APP_VERSION, surveys: lote.map(r=>{ const f = filasElecciones(r); return {id:r.id, encuesta:filaEncuesta(r), elecciones_priv:f.priv, elecciones_tpc:f.tpc, raw:r}; })};
      const res = await fetch(CFG.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), redirect:"follow"});
      const js = await res.json();
      if(!js.ok) throw new Error(js.error || "Respuesta no válida del servidor");
      const okIds = new Set([...(js.saved||[]), ...(js.dup||[])]);
      const q = queue(); q.forEach(r=>{ if(okIds.has(r.id)){ r.estado = "enviada"; r.enviado = nowISO(); } }); saveQueue(q);
      sent += okIds.size;
    }
    if(!silent || sent) toast(`${sent} encuesta${sent!==1?"s":""} enviada${sent!==1?"s":""} al servidor`);
  }catch(err){
    if(!silent) toast("No fue posible enviar: " + (err.message||err) + ". Se reintentará más tarde.", 4000);
  }finally{ syncing = false; updateNet(); if(S.view==="home"||S.view==="list") render(); }
  return sent;
}
function updateNet(){
  const n = document.getElementById("net"), on = navigator.onLine;
  n.className = "pill " + (on?"on":"off"); n.textContent = on ? "En línea" : "Sin conexión";
  const p = queue().filter(r=>r.estado!=="enviada").length, b = document.getElementById("pend");
  b.hidden = !p; b.textContent = p + " por enviar";
}
window.addEventListener("online", ()=>{ updateNet(); sync(true); });
window.addEventListener("offline", updateNet);
setInterval(()=>sync(true), 120000);

/* ---------- Exportación ---------- */
function toCSV(rows){
  if(!rows.length) return "";
  const keys = []; rows.forEach(r=>Object.keys(r).forEach(k=>{ if(!keys.includes(k)) keys.push(k); }));
  const cell = v => { if(v==null) return ""; const s = String(v); return /[";\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [keys.join(";"), ...rows.map(r=>keys.map(k=>cell(r[k])).join(";"))].join("\r\n");
}
function download(name, text, type){
  const blob = new Blob([type.includes("csv")?"\ufeff"+text:text], {type});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,"-"); }
function exportCSV(){
  const q = queue(); if(!q.length) return;
  const enc = q.map(filaEncuesta), pv = [], tp = [];
  q.forEach(r=>{ const f = filasElecciones(r); pv.push(...f.priv); tp.push(...f.tpc); });
  download(`PD_encuestas_${CFG.device}_${stamp()}.csv`, toCSV(enc), "text/csv;charset=utf-8");
  if(pv.length) setTimeout(()=>download(`PD_elecciones_privado_${CFG.device}_${stamp()}.csv`, toCSV(pv), "text/csv;charset=utf-8"), 400);
  if(tp.length) setTimeout(()=>download(`PD_elecciones_TPC_${CFG.device}_${stamp()}.csv`, toCSV(tp), "text/csv;charset=utf-8"), 800);
}

/* ---------- Eventos ---------- */
document.getElementById("goHome").addEventListener("click", ()=>{ if(S.view!=="form" && S.view!=="ficha") go("home"); else if(confirm("¿Ir al inicio? La encuesta en curso queda guardada como borrador.")) go("home"); });
document.getElementById("pend").addEventListener("click", ()=>sync(false));

app.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t || t.disabled) return;
  const d = S.rec ? S.rec.datos : null;

  if(t.dataset.ck){ // selección única
    const f = S.fields.find(x=>x.k===t.dataset.ck);
    const o = norm(f.opts).find(x=>String(x.v)===t.dataset.v);
    d[f.k] = (d[f.k]===o.v && !f.req) ? "" : o.v;
    t.parentElement.querySelectorAll("[data-ck]").forEach(b=>b.classList.toggle("sel", b===t && d[f.k]!==""));
    t.closest(".fld").classList.remove("err");
    if(f.k==="modulo"){ S.rec.diseno = null; S.rec.elecciones = null; }
    saveDraft(); refreshVisibility(); return;
  }
  if(t.dataset.mk){ // selección múltiple con máximo
    const k = t.dataset.mk, max = +t.dataset.max, f = S.fields.find(x=>x.k===k);
    const o = norm(f.opts).find(x=>String(x.v)===t.dataset.v);
    let arr = Array.isArray(d[k]) ? d[k].slice() : [];
    if(arr.includes(o.v)) arr = arr.filter(x=>x!==o.v);
    else { if(arr.length >= max){ toast(`Máximo ${max} opciones`); return; } arr.push(o.v); }
    d[k] = arr; t.classList.toggle("sel"); t.closest(".fld").classList.remove("err"); saveDraft(); return;
  }
  if(t.dataset.lk){
    d[t.dataset.lk] = +t.dataset.v;
    t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("sel", b===t));
    t.closest(".lk-row").classList.remove("miss"); saveDraft(); return;
  }
  if(t.dataset.gps){ captureGPS(false); return; }
  if(t.dataset.bloque){ S.rec.diseno.bloque = +t.dataset.bloque; S.rec.diseno.regla = "Asignado manualmente"; saveDraft(); render(); return; }

  if(t.dataset.pick){
    const e = S.rec.elecciones[S.ficha];
    e.respuesta = t.dataset.pick; e.motivo_omision = ""; S._omit = false;
    e.segundos = e._t0 ? Math.round((Date.now()-e._t0)/1000) : e.segundos;
    if(S.rec.datos.modulo !== "TPC") e.eligio_tp = (e.respuesta === e.lado_tp) ? 1 : 0;
    saveDraft(); render(); return;
  }
  if(t.dataset.omit){
    const e = S.rec.elecciones[S.ficha];
    e.respuesta = ""; e.eligio_tp = null; e.motivo_omision = t.dataset.omit; e.usaria = "";
    e.segundos = e._t0 ? Math.round((Date.now()-e._t0)/1000) : e.segundos;
    saveDraft(); render(); return;
  }
  if(t.dataset.usaria){ const e = S.rec.elecciones[S.ficha]; e.usaria = t.dataset.usaria; saveDraft(); t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("sel", b===t)); return; }

  switch(t.dataset.act){
    case "new": newSurvey(); break;
    case "resume": S.step = S.rec._step || 0; go("form"); break;
    case "discard": if(confirm("¿Descartar la encuesta en curso? Esta acción no se puede deshacer.")){ LS.del(K.draft); S.rec = null; render(); } break;
    case "home": go("home"); break;
    case "list": go("list"); break;
    case "cfg": go("cfg"); break;
    case "sync": sync(false); break;
    case "csv": exportCSV(); break;
    case "json": download(`PD_respaldo_${CFG.device}_${stamp()}.json`, JSON.stringify({exportado:nowISO(), dispositivo:CFG.device, encuestas:queue()}, null, 1), "application/json"); break;
    case "purge": if(confirm("Se eliminarán del dispositivo las encuestas ya enviadas al servidor. ¿Continuar?")){ saveQueue(queue().filter(r=>r.estado!=="enviada")); render(); } break;
    case "saveCfg":
      CFG.encuestador = document.getElementById("c_enc").value.trim();
      CFG.url = document.getElementById("c_url").value.trim();
      CFG.precio = num(document.getElementById("c_pr").value) || DEFAULT_GAS_PRICE;
      LS.set(K.cfg, CFG); toast("Ajustes guardados"); go("home"); sync(true); break;
    case "testUrl": {
      const u = document.getElementById("c_url").value.trim(); if(!u){ toast("Escriba la URL"); break; }
      fetch(u+"?ping=1").then(r=>r.json()).then(j=>toast(j.ok ? "Conexión correcta con: "+(j.hoja||"servidor") : "El servidor respondió con error"))
        .catch(()=>toast("No hubo respuesta. Revise la URL, la conexión y el acceso «Cualquier usuario».", 4000));
      break;
    }
    case "back": S.step = Math.max(0, S.step-1); saveDraft(); go("form"); break;
    case "next": {
      const miss = missingFields(); if(miss.length){ markMissing(miss); break; }
      if(STEPS[S.step].id === "elec"){
        const rec = S.rec;
        if(filtro(rec.datos)==="Aplica"){
          if(!rec.elecciones || !rec.elecciones.length){ toast("Inicie y complete las seis fichas"); break; }
          if(rec.elecciones.some(e=>!e.respuesta && !e.motivo_omision)){ toast("Hay fichas sin respuesta ni motivo de omisión"); break; }
        }
      }
      S.step = Math.min(STEPS.length-1, S.step+1); saveDraft(); go("form"); break;
    }
    case "finish": finishSurvey(); break;
    case "startF": generarFichas(S.rec); S.ficha = 0; S._omit = false; saveDraft(); go("ficha"); break;
    case "contF": { const i = S.rec.elecciones.findIndex(e=>!e.respuesta && !e.motivo_omision); S.ficha = i<0 ? 0 : i; S._omit = false; go("ficha"); break; }
    case "redoF": if(confirm("Se borrarán las respuestas de las fichas y se generará un nuevo orden. ¿Continuar?")){ S.rec.elecciones = null; S.rec.diseno = null; saveDraft(); render(); } break;
    case "omit": S._omit = true; render(); break;
    case "fPrev": S._omit = false; if(S.ficha===0) go("form"); else { S.ficha--; go("ficha"); } break;
    case "fNext": S._omit = false;
      if(S.ficha < S.rec.elecciones.length-1){ S.ficha++; go("ficha"); }
      else { S.step = STEPS.findIndex(s=>s.id==="cierre"); saveDraft(); go("form"); toast("Bloque de fichas completo"); }
      break;
  }
});

app.addEventListener("input", ev=>{
  const t = ev.target; if(!S.rec) return; const d = S.rec.datos;
  if(t.dataset.porque){ S.rec.elecciones[S.ficha].usaria_porque = t.value; saveDraft(); return; }
  if(t.dataset.k){
    const f = S.fields.find(x=>x.k===t.dataset.k);
    d[t.dataset.k] = (t.type==="number") ? (t.value===""?"":Number(t.value)) : t.value;
    if(f && t.dataset.k==="encuestador"){ /* se conserva en el registro */ }
  } else if(t.dataset.chk){ d[t.dataset.chk] = t.checked; if(t.checked){ d.gasto_percibido = ""; const i = app.querySelector("#f_gasto_percibido"); if(i) i.value = ""; } }
  else if(t.dataset.dur){
    const k = t.dataset.dur, box = t.closest(".dur");
    const h = box.querySelector('[data-part="h"]').value, m = box.querySelector('[data-part="m"]').value;
    d[k] = (h===""&&m==="") ? "" : (Number(h)||0)*60 + (Number(m)||0);
  } else return;
  const fl = t.closest(".fld"); if(fl) fl.classList.remove("err");
  saveDraft(); refreshVisibility();
});
app.addEventListener("change", ev=>{ if(ev.target.tagName==="SELECT" || ev.target.type==="checkbox") ev.target.dispatchEvent(new Event("input",{bubbles:true})); });

/* ---------- Arranque ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();
setTimeout(()=>sync(true), 1500);
</script>
